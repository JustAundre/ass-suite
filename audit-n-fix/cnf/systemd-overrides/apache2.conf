[Service]
#
# Privilege De-escalation
#
User=www-data
Group=www-data





#
# Resource limits
#
# Adjust as needed for your scale.
RestrictRealtime=true
TasksMax=512
MemoryMax=2G
MemoryHigh=1800M





#
# Filesystem protections
#
# Adjust as needed for your setup.
UMask=077
RuntimeDirectoryMode=755
WorkingDirectory=
ProtectSystem=strict
ProtectHome=tmpfs
ReadWritePaths=/var/log/apache2/ /var/run/apache2/ /run/apache2/
BindReadWritePaths=
ReadOnlyPaths=
BindReadOnlyPaths=
NoExecPaths=/tmp /var/tmp /dev/shm






#
# Capability limitations
#
# Adjust as needed.
SystemCallArchitectures=native
SystemCallFilter=@system-service @network-io @basic-io @file-system
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
#
# Allow IPC for local comm. w/ databases
RemoveIPC=false





#
# Filesystem Protections
#
ProtectProc=invisible
NoNewPrivileges=true
LockPersonality=true
RestrictNamespaces=true
RestrictSUIDSGID=true
ProtectControlGroups=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectClock=true
ProtectHostname=true
PrivateTmp=true
PrivateDevices=true
DevicePolicy=closed
#
# May break some applications
PrivateUsers=true
