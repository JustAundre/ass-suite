[Service]
# De-escalate service.
User=www-data
Group=www-data

# Resource limits | Adjust as needed for your scale.
RestrictRealtime=true
TasksMax=64
MemoryMax=2G
MemoryHigh=1800M

# Filesystem protections | Adjust as needed for your setup.
WorkingDirectory=
ProtectSystem=strict
ProtectHome=tmpfs
ReadWritePaths=
BindReadWritePaths=
ReadOnlyPaths=
BindReadOnlyPaths=

# Capability limitations | Adjust as needed for your setup.
SystemCallArchitectures=native
SystemCallFilter=@basic-io @file-system @system-service @network-io @process @signal @memlock @mmap
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE

# System & recon protection | Likely won't need to change
ProtectProc=invisible
NoNewPrivileges=true
LockPersonality=true
RestrictNamespaces=true
RestrictSUIDSGID=true
ProtectControlGroups=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectClock=true
ProtectHostname=true
PrivateTmp=true
PrivateDevices=true
DevicePolicy=closed

# May break some applications
PrivateUsers=true

# If using a local database via IPC, change to false.
RemoveIPC=true
