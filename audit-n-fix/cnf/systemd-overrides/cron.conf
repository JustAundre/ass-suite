[Service]
#
# Privilege De-escalation
#
# Not really any other choice.
User=root
Group=root





#
# Resource limits
#
# Adjust as needed for your scale.
RestrictRealtime=true
TasksMax=512
MemoryMax=1G
MemoryHigh=800M





#
# Filesystem protections
#
# Adjust as needed for your setup.
UMask=077
RuntimeDirectoryMode=755
WorkingDirectory=
ProtectSystem=strict
ProtectHome=tmpfs
ReadWritePaths=
BindReadWritePaths=
ReadOnlyPaths=
BindReadOnlyPaths=
NoExecPaths=/tmp /var/tmp /dev/shm






#
# Capability limitations
#
# Adjust as needed.
SystemCallArchitectures=native
SystemCallFilter=@system-service @network-io @basic-io @file-system
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityoundingSet=
AmbientCapabilities=
#
# Allow IPC for local comm. w/ databases
RemoveIPC=false





#
# Filesystem Protections
#
ProtectProc=invisible
NoNewPrivileges=true
LockPersonality=true
RestrictNamespaces=true
RestrictSUIDSGID=true
ProtectControlGroups=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectClock=true
ProtectHostname=true
PrivateTmp=true
PrivateDevices=true
DevicePolicy=closed
#
# May break some applications
PrivateUsers=true
