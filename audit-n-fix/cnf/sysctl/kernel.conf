#
# Network
#
# Ignore ICMP echo requests (prevents some discovery/DoS)
net.ipv4.icmp_echo_ignore_all = 1
#
# Disable IP Source Routing (prevents spoofing)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
#
# Disable ICMP Redirect Acceptance (prevents MITM attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
#
# Enable Reverse Path Filtering (prevents IP spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
#
# Log Martians
# (Packets with impossible source addresses)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
#
# Protect against SYN flood attacks
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2
#
# Additional network hardening
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_timestamps = 0
net.ipv4.tcp_rfc1337 = 1
#
# IPv6 Hardening
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
#
# Disables IPv4 IP forwarding
# (Only used by routers, really)
net.ipv4.ip_forward = 0
net.ipv4.conf.all.forwarding = 0





#
# Kernel/Memory
#
# Address Space Layout Randomization (ASLR)
# (Helps prevent buffer overflows)
kernel.randomize_va_space = 2
#
# Restrict access to kernel logs (dmesg) to privileged users
kernel.dmesg_restrict = 1
#
# Restrict use of the ptrace() system call (prevents process snooping)
kernel.yama.ptrace_scope = 1
#
# Restrict BPF JIT compiler to the root user
net.core.bpf_jit_harden = 2
#
# Disable the Magic SysRq key
# (prevents physical reboot/dump bypasses)
kernel.sysrq = 0
#
# Hides symbol addresses from all users
# (Symbol addresses are helpful in crafting buffer overflows)
kernel.kptr_restrict = 2
#
# Restricts use of the performance tracking subsystem
# (Has deep hardware access, and could be exploited to leak data)
kernel.perf_event_paranoid = 3
#
# Disables use of eBPF for non-root users
# (Runs programs directly inside the kernel)
# (Useful for monitoring, but has its risks if not controlled)
kernel.unprivileged_bpf_disabled = 1
#
# Stops SUID programs from creating core dumps on crash and
# stops core dumps from being stored anywhere respectively.
# (Core dumps may contain sensitive information)
fs.suid_dumpable = 0
kernel.core_pattern = /dev/null
#
# Disables auto-loading of TTY ldiscs
# (ldiscs - kernel modules to determine how data is interpreted)
# (Some modules are old and most definitely obscure modules have some CVEs)
dev.tty.ldisc_autoload = 0





#
# Filesystem Hardening
#
# Prevent creating hardlinks/symlinks to files you don't own
# (Could be used to bypass certain file permission restrictions)
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
#
# Prevent users from creating files in world-writable sticky directories
fs.protected_fifos = 2
fs.protected_regular = 2
